<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>БИМ БИМ БАМ БАМ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Unbounded:wght@300;500;800&family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--c:#3b82f6;--fg:#f8fafc;--mut:#94a3b8;--card:rgba(11,13,20,.72);--line:rgba(148,163,184,.18);--bad:#ef4444}
*{box-sizing:border-box;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:#05070d;color:var(--fg);font-family:Manrope,system-ui,sans-serif}
canvas{display:block;position:fixed;inset:0}
.mono{font-family:'JetBrains Mono',monospace}
.card{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:16px}
/* телефон: размытие фона под карточками пересчитывается каждый кадр и стоит дороже всей сцены */
@media (pointer:coarse){.card{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(9,12,20,.92)}}
body.lowfx .card{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(9,12,20,.92)}
body.lowfx .lab{will-change:auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;pointer-events:auto}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
svg.ic.f{fill:currentColor;stroke:none}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
/* список держав */
#plist{position:absolute;left:16px;top:16px;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:9px 18px;width:290px;pointer-events:auto}
.pr{display:grid;grid-template-columns:10px 38px 1fr;align-items:center;gap:7px;font:700 14px 'JetBrains Mono',monospace}
.pr i{width:10px;height:10px;border-radius:50%;background:currentColor}
.pr{cursor:pointer}.pr:hover span{color:#fff}
.pr span{color:var(--mut)}
.pr.me span{color:#fff}.pr.hum span{color:#fde047}
.pr.dom span::after{content:"★";color:#fde047;margin-left:2px}
.pr .bar{height:8px;border-radius:4px;background:rgba(148,163,184,.18);overflow:hidden}
.pr .bar b{display:block;height:100%;background:currentColor;transition:width .4s}
.pr.dead{opacity:.28}.pr.dead span{text-decoration:line-through}
#top{position:absolute;left:50%;top:14px;transform:translateX(-50%);text-align:center}
#clock{font-size:12px;letter-spacing:.25em;color:var(--mut)}
#warn{margin-top:8px;display:none;gap:6px;justify-content:center;flex-wrap:wrap;pointer-events:auto;max-width:70vw}
#warn button{padding:7px 14px;border-radius:999px;border:1px solid var(--bad);color:#fecaca;background:rgba(239,68,68,.16);font-size:12px;font-weight:700;white-space:nowrap;animation:blink .7s infinite alternate}
#warn button.s{border-color:#38bdf8;color:#bae6fd;background:rgba(56,189,248,.14);animation:none}
#warn button.k{color:#fff;background:rgba(239,68,68,.5)}
#warn button:hover{border-color:#fff}
/* ядерный пуск на отсчёте: кто, куда, сколько осталось и кнопка «осудить» */
#nukes{margin-top:8px;display:none;flex-direction:column;gap:6px;align-items:center;pointer-events:auto}
#nukes div{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:min(560px,96vw);padding:6px 8px 6px 14px;border-radius:18px;border:1px solid #ff3b3b;background:rgba(90,16,16,.9);color:#fecaca;font-size:12px;font-weight:700;cursor:pointer}
#nukes div.me{background:rgba(220,38,38,.75);color:#fff;animation:blink .7s infinite alternate}
#nukes b{color:#fff}
#nukes small{flex-basis:100%;font-size:11px;font-weight:500;color:#fecaca;opacity:.9;max-width:560px;text-align:center}
#nukes button{padding:5px 12px;border-radius:999px;border:1px solid #fff;background:#fff;color:#7f1d1d;font-weight:800;font-size:11px;cursor:pointer}
#nukes button[disabled]{background:none;color:#fecaca;border-color:rgba(254,202,202,.5);cursor:default}
/* эскалация: уровень войны, темп и нагрузка на снабжение */
#esc{margin:6px auto 0;display:none;gap:8px;align-items:center;justify-content:center;width:max-content;padding:4px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font:700 10px 'JetBrains Mono',monospace;letter-spacing:.08em;pointer-events:auto;cursor:help}
#esc .ep{display:flex;gap:2px}#esc .ep i{width:14px;height:4px;border-radius:2px;background:rgba(148,163,184,.25);overflow:hidden}#esc .ep i b{display:block;height:100%;background:currentColor}
#esc .sup{color:#fca5a5}#esc.up{animation:pulse 1s 3}
@keyframes blink{to{background:rgba(239,68,68,.42)}}
#feed{position:absolute;right:16px;top:16px;width:250px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#feed div{font-size:12px;font-weight:600;padding:6px 11px;border-radius:10px;background:var(--card);border-left:2px solid var(--c);animation:fin .25s ease-out;transition:opacity .8s}
@keyframes fin{from{transform:translateX(24px);opacity:0}}
/* нижняя панель */
#dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:stretch;gap:6px;padding:8px;pointer-events:auto}
#en{pointer-events:auto;display:grid;align-content:center;justify-items:center;padding:0 14px 0 10px;min-width:92px}
#en b{font-size:24px;color:var(--mut);line-height:1}#en.hot b{color:#fde047}
#en small{font-size:10px;color:var(--mut);margin-top:4px}
.sep{width:1px;background:var(--line);margin:4px 2px}
.wb,.ub{position:relative;width:58px;height:66px;border-radius:12px;border:1px solid var(--line);background:rgba(148,163,184,.06);display:grid;justify-items:center;align-content:center;gap:2px;transition:transform .15s,background .15s,border-color .15s,opacity .15s}
.wb:hover:not(.off),.ub:hover:not(.off){background:rgba(148,163,184,.18);border-color:#fff;transform:translateY(-2px)}
.wb .lbl,.ub .lbl{font-size:9px;letter-spacing:.06em;color:var(--mut)}
.wb .cost,.ub .cost{font-size:10px;color:#fde047}
.wb .cnt{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--c);color:#000;font-size:11px;display:grid;place-items:center;padding:0 5px}
.wb .cnt.z{background:#1e293b;color:var(--mut)}
.wb.off,.ub.off{opacity:.36}.wb.run,.ub.run{border-color:#fde047}
.wb.lock svg.ic{opacity:.3}.wb.lock::after{content:"";position:absolute;inset:0;border-radius:12px;background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(148,163,184,.08) 6px 7px)}
.ub{width:50px}
/* кнопка ядерного удара: отдельная, красная, в режиме прицела мигает */
.nkb{position:relative;width:58px;height:66px;border-radius:12px;border:1px solid #ff3b3b;background:rgba(239,68,68,.16);color:#ff6a5a;display:grid;justify-items:center;align-content:center;gap:2px;transition:transform .15s,background .15s,border-color .15s,opacity .15s}
.nkb:hover:not(.off){background:rgba(239,68,68,.38);border-color:#fff;color:#fff;transform:translateY(-2px)}
.nkb .lbl{font-size:9px;letter-spacing:.06em;color:#fca5a5}.nkb .cost{font-size:10px;color:#fde047}
.nkb .cnt{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:#ff3b3b;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.nkb .cnt.z{background:#1e293b;color:var(--mut)}
.nkb.off{opacity:.36}.nkb.on{background:#ef4444;color:#fff;border-color:#fff;animation:blink .45s infinite alternate}
body.nukemode canvas{cursor:crosshair!important}
/* памятка в режиме прицела: что будет, если нажать */
#nukehelp{display:none;position:fixed;right:16px;top:50%;transform:translateY(-50%);width:min(340px,92vw);padding:14px 16px;border-color:#ff3b3b;font-size:12.5px;line-height:1.45;z-index:30;pointer-events:none}
#nukehelp b{display:block;color:#ff6a5a;font-size:12px;letter-spacing:.06em;margin-bottom:8px}
#nukehelp p{margin:0 0 7px;padding-left:24px;position:relative}
#nukehelp p i{position:absolute;left:0;top:1px;width:17px;height:17px;border-radius:50%;background:#ff3b3b;color:#fff;font-style:normal;font-size:10px;font-weight:800;display:grid;place-items:center}
#nukehelp u{color:#fde047;text-decoration:none;font-weight:800}
#nukehelp small{display:block;color:var(--mut);margin-top:8px}
/* вспышка ядерного взрыва и красные края экрана, пока удар в воздухе */
#flash{position:fixed;inset:0;background:radial-gradient(circle,#fff 0%,#fff2c8 45%,#ff9a3a 100%);opacity:0;pointer-events:none;z-index:40}
body.nukeair::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:39;box-shadow:inset 0 0 140px 30px rgba(255,40,20,.6);animation:nukepulse .5s infinite alternate}
@keyframes nukepulse{to{opacity:.3}}
.pips{display:flex;gap:2px}.pips i{width:8px;height:3px;border-radius:2px;background:rgba(148,163,184,.25)}.pips i.on{background:#fde047}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(253,224,71,.25);border-color:#fde047}}
#abil{position:absolute;right:16px;bottom:16px;padding:9px 13px;display:flex;gap:9px;align-items:center;font-size:12px;font-weight:700;pointer-events:auto;color:var(--c)}
#abil span{color:var(--fg)}
#misc{position:absolute;left:16px;bottom:16px;display:flex;gap:6px}
#sitebar{position:absolute;right:16px;bottom:72px;display:flex;gap:6px;pointer-events:auto}
#sitebar .ib{color:#fde047;border-color:#fbbf24;cursor:help}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--mut);transition:.15s}
.ib:hover{color:#fff;border-color:#fff}
.ib.on{background:rgba(56,189,248,.22);border-color:#38bdf8}
#bping.on{background:rgba(253,224,71,.25);border-color:#fde047;color:#fde047}
/* подсказка-обучение */
#coach{position:fixed;left:50%;bottom:108px;transform:translateX(-50%);z-index:3;padding:10px 12px 10px 16px;display:none;align-items:center;gap:12px;font-size:13px;font-weight:700;pointer-events:auto;border-color:rgba(253,224,71,.5);max-width:min(560px,90vw)}
#coach.anchored{left:0;top:0;bottom:auto;transform:none}
#coach::after{content:"";position:absolute;left:var(--tail,50%);bottom:-6px;width:10px;height:10px;background:var(--card);border-right:1px solid rgba(253,224,71,.5);border-bottom:1px solid rgba(253,224,71,.5);transform:translateX(-50%) rotate(45deg)}
#coach.below::after{top:-6px;bottom:auto;border-right:0;border-bottom:0;border-left:1px solid rgba(253,224,71,.5);border-top:1px solid rgba(253,224,71,.5)}
#coach.noTail::after{display:none}
#coach .n{color:#fde047;font-size:11px;white-space:nowrap}
#coach.ok .n{color:#4ade80}
#coach .t{min-width:0}
#coach button{padding:6px 12px;border-radius:9px;border:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap}
#coach button:hover{border-color:#fff}
/* причина, почему действие недоступно */
#why{position:fixed;left:0;top:0;z-index:7;display:none;max-width:min(320px,86vw);padding:8px 11px;border-radius:11px;border:1px solid rgba(253,224,71,.55);background:rgba(11,13,20,.97);color:#fde047;font:700 12px/1.35 Manrope,sans-serif;box-shadow:0 10px 28px rgba(0,0,0,.5);pointer-events:none}
/* круговое меню */
#radial{position:fixed;left:0;top:0;z-index:4;display:none}
#radial .rb{position:absolute;width:52px;height:52px;margin:-26px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(11,13,20,.9);display:grid;place-items:center;color:#fff;transition:transform .12s,background .12s;animation:rin .16s ease-out backwards}
#radial .rb:hover:not(.off){transform:scale(1.14);background:var(--bad);border-color:#fff}
#radial .rb.cap:hover:not(.off){background:var(--c)}
#radial .rb.off{opacity:.35;border-style:dashed}
#radial .rb b{position:absolute;bottom:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:#fff;color:#000;font-size:10px;display:grid;place-items:center}
#radial .dot{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;border:2px solid #fff}
#radial .ring{position:absolute;border-radius:50%;border:1px dashed rgba(255,255,255,.3);box-shadow:inset 0 0 50px rgba(5,7,13,.5);pointer-events:none;animation:rin .2s ease-out}
#radial .rb b{padding:0 4px}
#radial .rb.res{border-color:#fde047;color:#fde047}
#radial .rb.res:hover:not(.off){background:#854d0e}
#radial .rs{position:absolute;width:24px;height:24px;margin:-12px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(11,13,20,.94);font:700 10px 'JetBrains Mono',monospace;color:#cbd5e1;display:grid;place-items:center;animation:rin .16s ease-out backwards;transition:transform .12s}
#radial .rs:hover,#radial .rs:focus-visible{transform:scale(1.25);border-color:#fff;color:#fff}
#radial .rs.sc{color:#fca5a5;border-color:rgba(239,68,68,.65)}
#radial .rs.au{font-size:14px}
#radial .rs.au.on{background:#fde047;color:#000;border-color:#fde047}
@keyframes rin{from{transform:scale(.4);opacity:0}}
#radial.noan *{animation:none!important}
#tip{position:fixed;z-index:8;pointer-events:none;display:none;padding:9px 12px;max-width:250px;font-size:12px;line-height:1.4;border-radius:12px}
#tip b{display:block;font-size:13px;margin-bottom:2px}#tip small{color:var(--mut);display:block;margin-top:4px}
/* подписи на глобусе */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;text-align:center;will-change:transform;display:none;transform-origin:50% 0}
.lab .n{font-family:Unbounded;font-weight:500;font-size:9px;letter-spacing:.07em;text-shadow:0 0 6px #000,0 0 2px #000;white-space:nowrap}
.lab .hb{width:52px;height:5px;border-radius:3px;background:rgba(0,0,0,.55);margin:3px auto 0;overflow:hidden;border:1px solid rgba(255,255,255,.18)}
.lab .hb b{display:block;height:100%;background:currentColor}
.lab svg.ic{width:13px;height:13px;stroke-width:2.4}
.lab .sl{display:flex;gap:4px;align-items:center;justify-content:center;margin:3px auto 0;width:max-content;padding:2px 5px;border-radius:7px;background:rgba(5,7,13,.8);border:1px solid rgba(148,163,184,.25)}
.lab .sl .k{display:flex;align-items:center;gap:1px;font:700 10px 'JetBrains Mono',monospace}
.lab .sl i{width:6px;height:6px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.lab .jb{display:flex;align-items:center;gap:4px;justify-content:center;margin:3px auto 0;width:max-content;padding:2px 6px;border-radius:7px;background:rgba(5,7,13,.85);border:1px solid rgba(253,224,71,.5);color:#fde047}
.lab .jb .ji{display:flex}
.lab .jb .jp{width:48px;height:6px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}.lab .jb .jp b{display:block;height:100%;background:#fde047}
.lab .jb .js{font-size:10px;color:#fff}
.lab .sl .k.au{outline:1px solid #fde047;border-radius:4px;padding:0 2px}
.lab .st{display:flex;gap:4px;align-items:center;justify-content:center;margin:3px auto 0;width:max-content;max-width:200px;padding:2px 7px;border-radius:7px;background:rgba(40,28,4,.9);border:1px solid #fbbf24;color:#fde047;font:700 9px Manrope,sans-serif;letter-spacing:.04em}
.lab .st small{display:none;flex-basis:100%;font-weight:600;color:#fef3c7;white-space:normal;text-align:left;font-size:9px;line-height:1.3}
.lab.show .st{flex-wrap:wrap}.lab.show .st small{display:block}
#labels.far .lab:not(.show) .st span{display:none}
.lab .th{margin:3px auto 0;width:max-content;padding:2px 7px;border-radius:7px;font:800 9px Manrope,sans-serif;letter-spacing:.05em;color:#fff;background:rgba(190,30,30,.92);border:1px solid #fecaca;animation:blink .5s infinite alternate}
.lab .th.s{background:rgba(8,60,95,.92);border-color:#38bdf8;color:#bae6fd;animation:none}
.lab.idle .sl{border-color:#fde047;animation:idl .8s infinite alternate}
@keyframes idl{to{border-color:transparent}}
.lab.zone .n{display:none}.lab.zone.show .n,#labels.near .lab.zone .n{display:block}.lab.zone .hb{width:36px}
#labels.far .lab.zone .hb,#labels.far .lab .sl i,#labels.far .lab .sl.emp{display:none!important}
.bdg{font-family:Unbounded;font-weight:800;font-size:15px;color:#05070d;padding:7px 11px;border-radius:10px;white-space:nowrap;box-shadow:0 0 18px currentColor}
#abil .bdg{font-size:12px;padding:5px 8px}
#pings{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.ping{position:absolute;left:0;top:0;display:grid;justify-items:center;gap:1px;color:var(--pk);font:800 11px Manrope,sans-serif;text-shadow:0 0 6px #000,0 0 2px #000;white-space:nowrap}
.ping i{position:relative;width:34px;height:34px;margin-top:-17px;border-radius:50%;border:2px solid var(--pk);display:grid;place-items:center;background:rgba(5,7,13,.75);box-shadow:0 0 18px var(--pk);animation:pingb .45s ease-out 8 alternate}
.ping i::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--pk);animation:pingr 1.1s ease-out infinite}
.ping svg.ic{width:16px;height:16px}
@keyframes pingb{to{transform:translateY(-8px)}}@keyframes pingr{to{transform:scale(2.8);opacity:0}}
#kbx{position:fixed;left:50%;top:50%;width:26px;height:26px;margin:-13px;border:2px solid rgba(255,255,255,.8);border-radius:50%;pointer-events:none;display:none;z-index:3;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #000}
#kbx::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff}
body.pingmode canvas{cursor:crosshair!important}
/* экраны */
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5vh 16px 4vh;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 38%,rgba(3,5,10,.9))}
.ov>*{pointer-events:auto}
.ov h1{font-family:Unbounded;font-size:clamp(30px,6vw,80px);margin:0;font-weight:800;letter-spacing:.32em;margin-right:-.32em;text-shadow:0 0 50px rgba(59,130,246,.9)}
#start h1{font-family:'Russo One',Impact,'Arial Black',sans-serif;font-size:clamp(48px,8.5vw,116px);font-weight:400;letter-spacing:.025em;margin-right:0;line-height:.94;text-align:center;transform:skewY(-3deg);background:linear-gradient(#fff8d4 4%,#ffcf56 40%,#ff731e 72%,#d62622 100%);background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(255,229,162,.35);filter:drop-shadow(0 5px 0 #651717) drop-shadow(0 0 24px #f9542660);text-shadow:none}
#roster{font-size:12px;line-height:1.6;text-align:center;color:#cbd5e1}
#pick .chip.his{opacity:.55}
.tag{font-size:11px;letter-spacing:.4em;color:var(--mut);margin-top:10px;text-align:center}
.bot{display:grid;justify-items:center;gap:12px;max-width:820px}
#pick{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700;display:flex;gap:7px;align-items:center;transition:.15s}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--pc)}
.chip:hover{border-color:var(--pc)}
.chip.sel{background:var(--pc);color:#05070d;border-color:#fff}.chip.sel i{background:#05070d}
.chip.his{outline:2px dashed #fff;outline-offset:2px}
#acard{padding:10px 16px;display:flex;gap:12px;align-items:center;font-size:13px;min-height:52px;max-width:560px}
#acard b{display:block}#acard span{color:var(--mut);font-size:12px}
#opts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
#mp{display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;padding:8px 12px;font-size:12px}
#mp input[type=text]{width:86px;background:rgba(148,163,184,.1);border:1px solid var(--line);border-radius:9px;color:#fff;padding:8px 10px;font-family:'JetBrains Mono';font-size:13px;letter-spacing:.2em;text-transform:uppercase;user-select:text}
#mcode{font-size:20px;letter-spacing:.3em;color:#fde047;user-select:text}
#mstat{font-size:12px;color:#fde047;min-height:16px;text-align:center}
#go{font-family:Unbounded;font-weight:800;font-size:14px;padding:15px 48px;letter-spacing:.25em;background:#fff;color:#000;border-radius:999px;box-shadow:0 0 40px rgba(59,130,246,.8);transition:.15s}

/* d — данные снаряда (их же шлём по сети); здесь к ним добавляется картинка */

function hit(q){const t=q.T,p=q.owner;
 if(!hostile(p,t)){fxNet('nuke',t.i,.25,p);return;}
 const dmg=dmgTo(p,q.w,t);t.hp-=dmg;t.dirty=true;PW[t.owner].grudge[p]+=dmg;   // бот запомнит, кто его бил

const mtx=new THREE.Matrix4(),vx=new THREE.Vector3(),vy=new THREE.Vector3(),vz=new THREE.Vector3(),qd=new THREE.Vector3();

/* ================= ПРИКАЗЫ (проверяются на хосте) ================= */
/* как в классике жанра: у каждой земли свои ячейки и одно дело за раз (строить, захватывать, исследовать) */
function pickLand(p,w){const Ls=lands(p).filter(t=>!t.job&&free(t)>0);if(!Ls.length)return null;
 if(w==='pvo')return Ls.sort((a,b)=>a.st.pvo-b.st.pvo||(b.home===p)-(a.home===p))[0];
 const foes=T.filter(t=>hostile(p,t)),d=t=>Math.min(9,...foes.map(f=>ang(t,f)));return Ls.sort((a,b)=>d(a)-d(b))[0];}
function build(p,w,x,preview=false){const P=PW[p];if(!P||!P.alive||!BK.includes(w)||P.up.rkt<wLvl(p,w))return false;
 const t=x||pickLand(p,w);if(!t||!t.alive||t.owner!==p||t.job||free(t)<=0)return false;if(preview)return true;
 t.job={k:'b',w,t:0,dur:landTime(t,w)};t.dirty=true;return true;}
function autoBuild(p,t,w,preview=false){const P=PW[p];if(!P?.alive||!t?.alive||t.owner!==p||(w!==''&&(!BK.includes(w)||P.up.rkt<wLvl(p,w))))return false;
 if(!preview){t.auto=w||null;t.dirty=true;}return true;}
function upgrade(p,k,x,preview=false){const P=PW[p];if(!P||!P.alive||!UK.includes(k)||P.up[k]>=3||sanctioned(p))return false;   // под санкциями исследовать нельзя
const R=resLands(p,k);if(R.length>=CFG.coopMax)return false;
 const t=x||lands(p).filter(t=>!t.job).sort((a,b)=>free(a)-free(b))[0];if(!t||!t.alive||t.owner!==p||t.job)return false;if(preview)return true;
 t.job=R.length?{k:'r',w:k,t:R[0].job.t,dur:R[0].job.dur}:{k:'r',w:k,t:0,dur:upTime(p,k)};t.dirty=true;return true;}
function capture(p,t,x,preview=false){const P=PW[p];if(!P||!P.alive||!t||!t.alive||t.owner!==-1||t.cap)return false;
 const s=x||capSources(p,t)[0];if(!s||!s.alive||s.owner!==p||s.job||(!t.adj.includes(s)&&!t.sea.includes(s)))return false;if(preview)return true;
 s.job={k:'c',x:t.i,t:0,dur:capDuration(p,s,t)};t.cap={by:p,t:0,dur:s.job.dur};s.dirty=t.dirty=true;return true;}
function scrap(p,t,w,preview=false){if(!PW[p]?.alive||!t||!t.alive||t.owner!==p||!BK.includes(w)||t.st[w]<=0)return false;
 if(!preview){t.st[w]--;t.dirty=true;}return true;}
function clearStock(p,t,preview=false){if(!PW[p]?.alive||!t||!t.alive||t.owner!==p||used(t)<=0)return false;
 if(!preview){for(const w of BK)t.st[w]=0;t.dirty=true;}return true;}
function cancelJob(p,t,preview=false){if(!PW[p]?.alive||!t||!t.alive||t.owner!==p||!t.job)return false;
 if(!preview){if(t.job.k==='c'){const x=T[t.job.x];if(x?.cap?.by===p){x.cap=null;x.dirty=true;}}t.job=null;t.dirty=true;}return true;}
function launch(p,w,s,t){const n=wCount(p,w);for(let k=0;k<n;k++)later(k*.5,()=>{if(t.alive)spawn(p,w,s,t,k);});}
/* залп с умным порядком. Цель под щитом: первыми приходят дроны, за ними лёгкие ракеты, тяжёлые последними, когда заряды уже выбиты.
   Гиперзвуку щит не важен, он уходит сразу. Щита нет: тяжёлое летит первым. Q — пары [земля, оружие], уже списанные со склада */
const RANK={d:0,t:1,h:1,m:2,i:3};
function salvo(p,t,Q){const cov=cover(t)>0;let prev=0;
 Q.sort((a,b)=>cov?RANK[a[1]]-RANK[b[1]]:RANK[b[1]]-RANK[a[1]]).forEach(([s,w],i)=>{const sp=WPN[w].spd,eta=(sp[0]+sp[1]*ang(s,t))*checkAt(w);let dl=i*.6;
  if(cov&&w!=='h'){dl=Math.max(dl,prev+.5-eta);prev=dl+eta+(wCount(p,w)-1)*.5;}
  /* цель сгорела или сменила хозяина, пока ракета ждала очереди: возвращаем её на склад */
  later(dl,()=>{if(hostile(p,t))launch(p,w,s,t);else if(s.alive&&s.owner===p){s.st[w]++;s.dirty=true;}});});}
function fire(p,w,t,preview=false){const P=PW[p];if(!P||!P.alive||time<CFG.peace||!t||!hostile(p,t))return false;
 {const cf=coalFoe(p);if(cf>=0&&t.owner!==cf)return false;}   // в коалиции бьют только изгоя
 const ban=sanctioned(p);   // под санкциями ракеты не взлетают, летают только дроны
 if(w==='*'){const Q=[];for(const s of lands(p))for(const w2 of WK)if(!(ban&&w2!=='d')&&ang(s,t)<=wRange(p,w2))for(let k=0;k<s.st[w2]&&Q.length<CFG.volleyMax;k++)Q.push([s,w2]);
  if(!Q.length)return false;if(preview)return true;for(const [s,w2] of Q){s.st[w2]--;s.dirty=true;}salvo(p,t,Q);return true;}
 if(!WK.includes(w)||(ban&&w!=='d'))return false;const s=srcFor(p,w,t);if(!s)return false;if(preview)return true;

/* ================= ЯДЕРНЫЙ УДАР И ОСУЖДЕНИЕ ================= */
/* Пуск идёт с отсчётом, и его видят все. Удар летит в любом случае: голосование решает только цену.
   Санкции обязательны. Большинство живых противников создаёт коалицию. */
const nukeBy=p=>nukes.find(n=>n.by===p)||null;
/* кто вправе осуждать пуск державы by: все живые не из её команды */
const nukeJury=by=>POWERS.map((_,p)=>p).filter(p=>PW[p].alive&&team[p]!==team[by]);
/* большинство живых противников для коалиции */
function nukeNeed(by){
 return Math.floor(nukeJury(by).length/2)+1;
}
function nukeOrder(p,t,preview=false){
 const P=PW[p];
 if(!P||!P.alive||P.nuke<=0||time<Math.max(CFG.peace,CFG.nuke.unlock)||sanctioned(p)||!t||!hostile(p,t)||nukeBy(p))return false;
 const cf=coalFoe(p);
 if(cf>=0&&t.owner!==cf)return false;
 if(preview)return true;
 P.nuke--;
 nukes.push({by:p,ti:t.i,t:CFG.nuke.count,votes:[]});
 fxNet('log',`${POWERS[p].name} готовит ядерный удар: ${t.name} (${POWERS[t.owner].name}). ${CFG.nuke.count} с на голосование`,'#ff3b3b');
 /* боты решают не сразу, а по ходу отсчёта */
 for(const b of nukeJury(p)){
  if(humans.has(b)||Math.random()>=aiCondemnOdds(b,p,t))continue;
  later(1+Math.random()*(CFG.nuke.count-3),()=>condemn(b,p));
 }
 return true;
}
function condemn(p,by,preview=false){
 const n=nukeBy(by);
 if(!n||!PW[p]?.alive||team[p]===team[by]||n.votes.includes(p))return false;
 if(preview)return true;
 n.votes.push(p);
 fxNet('log',`${POWERS[p].name} голосует за коалицию: голосов ${n.votes.length}, для коалиции нужно ${nukeNeed(by)}`,pcol(p));
 return true;
}
function resolveNuke(n){
 const by=n.by,P=PW[by],t=T[n.ti],name=POWERS[by].name;
 if(!P.alive)return;
 if(!hostile(by,t)){P.nuke++;fxNet('log',`${name}: ядерный удар отменён, цели больше нет`,pcol(by));return;}
 const src=lands(by).sort((a,b)=>ang(a,t)-ang(b,t))[0];
 const votes=n.votes.filter(p=>PW[p].alive),need=nukeNeed(by);   // считаем до пуска: он сам поднимает эскалацию
 spawn(by,'n',src,t);
 escBoost+=CFG.nuke.esc;
 P.sanc=Math.max(P.sanc,time+CFG.nuke.sanc);
 if(votes.length<need){fxNet('log',`${name}: санкции на ${CFG.nuke.sanc} с. Коалиция не собрана (${votes.length} из ${need})`,'#ff3b3b');return;}
 for(const p of votes){PW[p].coalFoe=by;PW[p].coalT=time+CFG.nuke.coal;}
 fxNet('log',`${name} под санкциями на ${CFG.nuke.sanc} с: никаких исследований и ракет, только дроны. Коалиция из ${votes.length} держав бьёт только её`,'#ff3b3b');
}
function stepNukes(dt){
 for(let i=nukes.length-1;i>=0;i--){
  const n=nukes[i];n.t-=dt;
  if(n.t>0&&PW[n.by].alive&&hostile(n.by,T[n.ti]))continue;
  nukes.splice(i,1);resolveNuke(n);
 }
}

function doCmd(p,m,preview=false){if(!Number.isInteger(p)||!PW[p]||!m||typeof m!=='object')return false;
 const land=v=>Number.isInteger(v)&&v>=0&&T[v]?T[v]:null,t=land(m.x),s=land(m.s);
 if(m.c==='nuke')return nukeOrder(p,t,preview);if(m.c==='condemn')return condemn(p,m.x,preview);   // у «осудить» x — номер державы, а не земли
 if(m.c==='scrap')return scrap(p,t,m.w,preview);if(m.c==='clear')return clearStock(p,t,preview);if(m.c==='cancel')return cancelJob(p,t,preview);if(m.c==='auto')return autoBuild(p,t,m.w,preview);
 if(m.c==='buy')return build(p,m.w,s,preview);if(m.c==='up')return upgrade(p,m.w,s,preview);if(m.c==='cap')return capture(p,t,s,preview);if(m.c==='fire')return fire(p,m.w,t,preview);return false;}
let cmdId=0;const pendingCmd=new Map();

 if(isGuest()){if(!net.conn.open||!doCmd(me,m,true))return false;m.id=++cmdId;
  return new Promise(resolve=>{const timer=setTimeout(()=>{pendingCmd.delete(m.id);resolve(false);},5000);pendingCmd.set(m.id,{resolve,timer});
   try{net.conn.send(m);}catch(e){clearTimeout(timer);pendingCmd.delete(m.id);resolve(false);}});}
 const ok=doCmd(me,m);refreshDock();return ok;}
function stepWorld(dt){refreshSites();stepNukes(dt);
 POWERS.forEach((_,p)=>{const P=PW[p];if(!P.alive)return;
  if(is(p,'AUS')){P.regen+=dt;if(P.regen>=20){P.regen=0;for(const t of lands(p))if(t.hp<t.maxHp){t.hp=Math.min(t.maxHp,t.hp+1);t.dirty=true;}}}});
 for(const t of T){
  if(!t.alive){if(t.rev>0){t.rev-=dt;if(t.rev<=0&&t.burns<2){t.alive=true;t.owner=-1;t.maxHp=t.hp=Math.round(CFG.zoneHp*CFG.wasteHp);t.slots=CFG.wasteSlots;t.marker.visible=true;t.dirty=true;}}continue;}
  const j=t.job;if(!j)continue;const p=t.owner;if(j.k==='r'&&sanctioned(p))continue;   // санкции замораживают исследования
  j.t+=j.k==='r'?dt*(1+CFG.coop*(resLands(p,j.w).length-1)):dt;
  if(j.k==='c'){const x=T[j.x];if(!x.alive||!x.cap||x.cap.by!==p){t.job=null;t.dirty=true;continue;}x.cap.t=j.t;}
  if(j.t<j.dur)continue;t.job=null;t.dirty=true;
  if(j.k==='b'){t.st[j.w]++;if(is(p,'CHN')&&++PW[p].nb%3===0&&free(t)>0)t.st[j.w]++;if(p===me)S.click();}
  else if(j.k==='r'){for(const s of resLands(p,j.w)){s.job=null;s.dirty=true;}PW[p].up[j.w]++;logTo(p,`готово: ${UP[j.w].n} ${PW[p].up[j.w]}`,'#fde047');}
  else{const x=T[j.x];x.cap=x.auto=null;x.owner=p;x.maxHp=x.hp=Math.round(CFG.zoneHp*(x.burns?CFG.wasteHp:1)*hpMul(p)*(x.site==='bun'?CFG.site.bunHp:1));x.slots=(x.burns?CFG.wasteSlots:CFG.zoneSlots)+slotBonus(p)+(x.site==='fab'?CFG.site.fabSlots:0);x.dirty=true;fxNet('shock',x.i,p);

 {const d=dominant();if(d!==dom){dom=d;if(d>=0)fxNet('log',`${POWERS[d].name}: сверхдержава. Боты бьют её первой`,'#fde047');}}}

function aiLand(p,L){const P=PW[p],foes=T.filter(t=>hostile(p,t));
 const nb=[...new Set([...L.adj,...L.sea])].filter(t=>t.alive&&t.owner===-1&&!t.cap);
 /* особый объект рядом: бот бросает всё и идёт за ним */
 const gold=nb.filter(t=>t.site);if(gold.length&&time>18)return capture(p,pick(gold),L);

 const reach=WK.filter(w=>foes.some(t=>ang(L,t)<=wRange(p,w)));
 if(free(L)<=0){if(res())return true;
  /* склад забит тем, что уже ни до кого не достаёт: списываем */
  const junk=WK.find(w=>L.st[w]>0&&!reach.includes(w));if(junk)scrap(p,L,junk);return false;}
 const near=foes.some(t=>ang(L,t)<1.7);
 /* бота недавно били: рядом с врагом он держит на заряд щита больше */
 const hot=near&&P.grudge.some(g=>g>6);
 if(L.st.pvo<(L.home===p?2:near?1:0)+(hot?1:0))return build(p,'pvo',L);
 if(!lands(p).some(t=>t.job&&t.job.k==='r')&&Math.random()<.4&&res())return true;
 const ok=reach.filter(w=>P.up.rkt>=wLvl(p,w));
 /* жертва закрыта щитом, а вскрывать нечем: строим дроны */
 if(ok.length)return build(p,P.need&&ok.includes(P.need)&&L.st[P.need]<2?P.need:Math.random()<.6?ok[ok.length-1]:pick(ok),L);
 if(P.up.rkt<3&&!researching(p,'rkt'))return upgrade(p,'rkt',L);
 return L.st.pvo<2?build(p,'pvo',L):res();}
/* кого давить: обидчика, сверхдержаву, того, кто уже ранен. Выбрав жертву, бот держится за неё aiFocus секунд. Возвращает державы по убыванию желания */
function aiFoes(p){const P=PW[p],D=CFG.diff[diff],out=[];
 {const cf=coalFoe(p);if(cf>=0)return[cf];}   // бот в коалиции бьёт только изгоя
 POWERS.forEach((_,o)=>{if(!PW[o].alive||team[o]===team[p])return;const L=lands(o);if(!L.length)return;
  const hp=L.reduce((a,t)=>a+t.hp,0)/L.reduce((a,t)=>a+t.maxHp,0);
  out.push([o,(1+P.grudge[o]*CFG.aiRevenge+(o===dom?CFG.dom.focus:0)+(sanctioned(o)?CFG.nuke.hate:0)+1.5*(1-hp))*(humans.has(o)?D.aggro:1)*(o===P.foe&&time<P.foeT?CFG.aiStick:1)*(.85+.3*Math.random())]);});
 return out.sort((a,b)=>b[1]-a[1]).map(a=>a[0]);}
/* план удара по земле: чем и в каком порядке бить, чтобы вскрыть щит и добить. list пуст, если удар только зря сожжёт ракеты о купол */
function strikePlan(p,t,max){const A={};for(const w of WK)A[w]=sanctioned(p)&&w!=='d'?0:lands(p).reduce((a,s)=>a+(ang(s,t)<=wRange(p,w)?s.st[w]:0),0);   // бот под санкциями бьёт только дронами

 const per=dronesPer(t.owner),full=w=>dmgTo(p,w,t)*wCount(p,w),out=[];let cov=cover(t),hp=t.hp,hurt=0;
 while(out.length<max&&hp>0){let w=null;
  if(cov>0){
   /* щит стоит: дроны выжирают заряды дешевле всего; гиперзвук идёт сквозь купол; МБР проходит, когда зарядов меньше двух; лёгкие ракеты выбивают заряды */
   if(A.d>0){A.d--;out.push('d');const n=wCount(p,'d'),eat=Math.min(cov,Math.ceil(n/per)),d=Math.max(0,n-eat*per)*dmgTo(p,'d',t);cov-=eat;hp-=d;hurt+=d;continue;}
   w=A.h>0?'h':cov<2&&A.i>0?'i':A.t>0?'t':A.m>0?'m':null;if(!w)break;
   if(w==='t'||w==='m'){A[w]--;out.push(w);cov=Math.max(0,cov-wCount(p,w));continue;}}
  else{const ok=WK.filter(k=>A[k]>0);if(!ok.length)break;
   /* добивание: самое слабое из того, что убивает; иначе самое сильное */
   w=ok.filter(k=>full(k)>=hp).sort((a,b)=>full(a)-full(b))[0]||ok.sort((a,b)=>full(b)-full(a))[0];}
  A[w]--;out.push(w);hp-=full(w);hurt+=full(w);}
 return{list:hurt>0||(out.length&&out.every(w=>w==='d'))?out:[],kill:hp<=0,blocked:cov>0&&!hurt};}
/* какую землю жертвы бить: раненую, ту, что сгорит с этого залпа, особый объект или столицу; прошлую цель бот старается добить */
function aiTarget(p,o,max){const P=PW[p];let best=null,bs=-1,bp=null;
 for(const t of lands(o)){const pl=strikePlan(p,t,max);if(!pl.list.length){if(pl.blocked&&!P.need)P.need='d';continue;}
  const sc=(1.7-t.hp/t.maxHp)*(pl.kill?2.2:1)*(t.site?1.4:1)*(t.home===o?1.2:1)*(t.i===P.tgt?1.5:1)/(1+.25*cover(t));
  if(sc>bs){bs=sc;best=t;bp=pl.list;}}
 return best&&[best,bp];}
/* с какой вероятностью бот b осудит ядерный удар державы by по земле t */
function aiCondemnOdds(b,by,t){
 const P=PW[b],o=t.owner;
 if(team[b]===team[o])return 1;                           // бьют по нему или по союзнику
 if((o===P.foe&&time<P.foeT)||o===dom)return 0;           // бьют его жертву или сверхдержаву: ему это на руку
 if(by===dom||P.grudge[by]>P.grudge[o]+1)return 1;        // пустил тот, кого бот и так не любит

}
/* после 05:00 бот учитывает обязательные санкции и риск коалиции; в отчаянии рискует чаще */
function aiNuke(p){
 const P=PW[p],h=POWERS[p].home;
 if(P.nuke<=0||time<CFG.nuke.unlock||sanctioned(p)||nukeBy(p))return false;

}
function aiThink(p){const P=PW[p],D=CFG.diff[diff];if(!P.alive)return;

function tutTick(){

function bottomStackTop(){let top=innerHeight;

function rectHit(r,x,y,w,h){return x<r.right&&x+w>r.left&&y<r.bottom&&y+h>r.top;}

  if(top<8){top=r.bottom+12;c.classList.add('below');}else c.classList.remove('below');tail=r.left+r.width/2-left;

  const obs=['misc','abil','sitebar'].map(id=>$(id)).filter(el=>{if(!el)return false;const b=el.getBoundingClientRect();const cs=getComputedStyle(el);
   return b.width>2&&b.height>2&&cs.display!=='none'&&cs.visibility!=='hidden';}).map(el=>el.getBoundingClientRect());
  if(obs.some(o=>rectHit(o,left,top,cr.width,cr.height))){
   const block=obs.filter(o=>rectHit(o,left,top,cr.width,cr.height));
   const rightEdge=Math.max(...block.map(o=>o.right))+8,leftEdge=Math.min(...block.map(o=>o.left))-8-cr.width;
   if(rightEdge+cr.width<=innerWidth-8)left=rightEdge;else if(leftEdge>=8)left=leftEdge;

  }
 }
 else{left=innerWidth/2-cr.width/2;top=bottomStackTop()-cr.height-12;noTail=true;c.classList.remove('below');}

 c.style.left=left+'px';c.style.top=top+'px';c.style.bottom='auto';c.style.transform='none';

function statsHtml(){const K=['shots','icp','cap','burn'],best={};for(const k of K)best[k]=Math.max(1,...PW.map(P=>P.stat[k]));
 const order=POWERS.map((_,i)=>i).sort((a,b)=>PW[b].alive-PW[a].alive||PW[b].stat.burn-PW[a].stat.burn||PW[b].stat.cap-PW[a].stat.cap||PW[b].stat.shots-PW[a].stat.shots);
 return'<tr><th>держава</th><th>выпущено</th><th>сбито щитами</th><th>захвачено</th><th>сожжено</th><th>земель</th></tr>'+order.map(i=>{const P=PW[i],c=k=>P.stat[k]>0&&P.stat[k]===best[k]?`<b>${P.stat[k]}</b>`:P.stat[k];
  return`<tr class="${i===me?'me':''}${P.alive?'':' dead'}"><td style="color:${POWERS[i].color}">${POWERS[i].name}${i===me?' · ты':humans.has(i)?' · игрок':''}</td>${K.map(k=>`<td>${c(k)}</td>`).join('')}<td>${lands(i).length}</td></tr>`;}).join('');}
function showEnd(){watching=false;$('estats').innerHTML=statsHtml();controls.autoRotate=true;$('hud').style.display='none';$('watch').hidden=matchEnded;$('again').hidden=!matchEnded;$('end').style.display='flex';}
function endMatch(){matchEnded=true;running=false;if(watching||$('end').style.display==='flex')showEnd();}
function finish(win){over=true;closeRadial();tut.on=false;tut.base=null;tut.doneAt=0;$('coach').style.display='none';$('why').style.display='none';$('hud').classList.toggle('watch',true);const mm=Math.floor(time/60);endTimer=setTimeout(()=>{endTimer=null;
  $('etitle').textContent=win?'ПОБЕДА':'ПЕПЕЛ';
  $('etext').textContent=win?(allied?`Вы с союзником пережили всех за ${mm} мин.`:`${POWERS[me].name} осталась одна на планете. На это ушло ${mm} мин.`):`${POWERS[me].name} сгорела на ${mm}-й минуте.`;
  showEnd();},2500);}
/* Личное поражение хоста не останавливает матч живого гостя. */
function checkEnd(){if(time<=1)return;const aliveTeams=new Set(T.filter(t=>t.alive&&t.owner>=0).map(t=>team[t.owner]));
 if(!over){if(!aliveTeams.has(team[me]))finish(false);else if(aliveTeams.size===1)finish(true);}
 if(!isGuest()&&(aliveTeams.size<=1||(humans.size&&![...humans].some(p=>PW[p].alive))))endMatch();}
$('watch').onclick=()=>{if(!over||matchEnded)return;watching=true;$('end').style.display='none';$('hud').style.display='block';controls.autoRotate=false;};
$('again').onclick=()=>{if(!matchEnded)return;if(isGuest()){if(net.conn.open)net.conn.send({t:'again'});}else resetToLobby();};

function clearBattleVisuals(){
 for(const q of projs)killProj(q);for(const f of fx)f(Infinity);projs.length=fx.length=0;
 pl.fill(0);pa.fill(0);pg.attributes.aA.needsUpdate=true;pcur=pid=shake=0;camera.position.sub(shakeV);shakeV.set(0,0,0);
 fly=null;down=null;hov=hovW=null;setNuke(false);$('flash').style.opacity=0;GU.uHov.value=-1;document.body.style.cursor='';controls.autoRotate=true;
 for(const t of T){t.marker.visible=true;t.col.set(pcol(t.owner));if(t.dome)t.dome.visible=false;}
}
function resetToLobby(){
 running=paused=over=matchEnded=watching=allied=false;time=hudT=netAcc=escBoost=0;nukes.length=0;warned=false;dom=-1;escSeen=-1;warnList=[];humans.clear();team=POWERS.map((_,i)=>i);
 clearTimeout(endTimer);endTimer=null;clearOrders();sched.length=netEv.length=0;
 T.forEach(t=>Object.assign(t,landState(t.home)));PW.forEach(p=>Object.assign(p,powerState()));clearBattleVisuals();
 closeRadial();tut.on=false;tut.base=null;tut.prog=null;tut.doneAt=0;
 for(const id of ['hud','end','tip','coach','warn','why'])$(id).style.display='none';
 $('hud').classList.toggle('watch',false);$('feed').replaceChildren();$('start').style.display='flex';
 if(isHost()){net.conn.send({t:'reset'});lobbyUpdate();}
 else if(!isGuest())resetLobby();
}

/* --- стартовый экран --- */
POWERS.forEach((p,i)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=`<i></i>${p.name}`;b.style.setProperty('--pc',p.color);
 b.onclick=()=>{if(running)return;if(net&&i!==me&&(roomPlayers().includes(i)||(isHost()&&[...net.guests.keys()].some(c=>c.player===i)))&&!(isGuest()&&net.assigned===i))return mstat('эта страна уже занята игроком');
  me=i;[...$('pick').children].forEach((x,j)=>x.classList.toggle('sel',j===i));GU.uHov.value=p.home.i+1;flyTo(p.home.pos,3.1);
  $('acard').innerHTML=`<span class="bdg" style="background:${p.color};color:${p.color}"><span style="color:#05070d">${p.badge}</span></span><div><b>${p.abil}</b><span>${p.adesc}</span></div>`;
  if(isHost())lobbyUpdate();else if(isGuest())net.conn.send({t:'pick',p:me});};$('pick').appendChild(b);});
$('opts').innerHTML=CFG.diff.map((d,i)=>`<button class="chip dch${i===1?' sel':''}" style="--pc:#fff" data-d="${i}">${d.n}</button>`).join('')+'<span class="sep" style="height:24px"></span><button class="chip" id="mpb" style="--pc:#fde047">с друзьями · до 5</button>';
$('opts').addEventListener('click',e=>{const b=e.target.closest('.dch');if(b){diff=+b.dataset.d;document.querySelectorAll('.dch').forEach(x=>x.classList.toggle('sel',x===b));}
 if(e.target.closest('#mpb'))$('mp').style.display=$('mp').style.display==='flex'?'none':'flex';});
let fly=null;
function flyTo(pos,dist){fly={from:camera.position.clone(),to:pos.clone().normalize().multiplyScalar(dist),t:0};zoomT=dist;controls.autoRotate=false;}
function startGame(c){au().resume();me=c.me;him=c.him;diff=c.diff;humans=new Set(c.players||[me,...(him>=0?[him]:[])]);allied=c.ally&&humans.size>1;
 team=POWERS.map((_,i)=>allied&&humans.has(i)?99:i);
 setSites(c.sites);
 POWERS.forEach((_,p)=>{const P=PW[p],h=POWERS[p].home;h.maxHp=h.hp=hp0(p);h.slots=CFG.homeSlots+slotBonus(p);h.st.t=1;h.st.pvo=is(p,'ISR')?4:2;if(is(p,'RUS'))h.st.i=1;if(is(p,'DEU'))P.up.eco=P.up.rkt=1;});T.forEach(t=>t.dirty=true);
 running=true;$('start').style.display='none';$('hud').style.display='block';GU.uHov.value=-1;buildDock();
 document.documentElement.style.setProperty('--c',POWERS[me].color);$('abil').innerHTML=`<span class="bdg" style="background:${POWERS[me].color}">${POWERS[me].badge}</span><span>${POWERS[me].abil}</span>`;$('abil').dataset.t=POWERS[me].adesc;
 flyTo(POWERS[me].home.pos,2.5);refreshDock();
 let seen=false;try{seen=localStorage.getItem('zarevo_tut');}catch(e){}tut.on=!seen;tut.step=0;tutProgressReset();showCoach();}
function startMatch(){if(isGuest()||running||over)return;const ally=$('ally').checked;
 const players=isHost()?roomPlayers():[me],sites=pickSites();
 if(isHost()){if(players.length<2)return mstat('пока никто не подключился');for(const c of net.guests.keys())if(c.open)c.send({t:'start',hp:me,gp:c.player,diff,ally,players,sites});}
 else if(netPeer){dropPeer();resetLobby();}
 startGame({me,him:isHost()?him:-1,diff,ally,players,sites});}
$('go').onclick=startMatch;
$('pick').children[0].click();

/* ================= ЦИКЛ ================= */
function sim(dt){if(!running||paused||matchEnded)return;time+=dt;
 for(let i=sched.length-1;i>=0;i--)if(sched[i].t<=time){const f=sched[i].fn;sched.splice(i,1);f();}
 stepWorld(dt);stepProjs(dt,true);
 POWERS.forEach((_,p)=>{if(humans.has(p))return;const P=PW[p];P.think-=dt;if(P.think<=0){P.think=rnd(CFG.aiThink)*CFG.diff[diff].tick;aiThink(p);}});
 checkEnd();netSend(dt,matchEnded);}
const neutralC=new THREE.Color(NEUTRAL);
/* какие кольца показать: кольцо атаки по врагу, кольцо экспансии по ничьей земле, дальность своего оружия */
function ringList(){if(!running||over||!PW[me].alive)return[];const w=+(.0032*camera.position.length()).toFixed(4),L=[],hw=hovW&&WPN[hovW]?hovW:null,mc=POWERS[me].color;
 const R=(t,r,col,dash,a,k=1)=>{if(r<3.05)L.push([t.i,+r.toFixed(3),+(w*k).toFixed(4),col,dash,a]);};
 if(radT){const t=radT;
  if(hostile(me,t)){R(t,.055,'#ef4444',24,1.5,1.5);
   for(const k of WK){if(hw&&hw!==k)continue;let s=null,bd=9;for(const x of lands(me))if(x.st[k]>0&&ang(x,t)<bd){bd=ang(x,t);s=x;}
    if(s)R(s,wRange(me,k),WCOL[k],bd<=wRange(me,k)?0:70,hw?1.3:.75);}}
  else if(t.owner===me){for(const k of WK)if(hw?hw===k:t.st[k]>0)R(t,wRange(me,k),WCOL[k],hw&&!t.st[k]?70:0,hw?1.2:.75);
   if(hovW==='pvo'||(!hw&&t.st.pvo>0))R(t,pvoRange(me),WCOL.pvo,t.st.pvo?0:50,.9);}
  else if(t.owner===-1){R(t,.065,mc,24,1.5,1.5);capSources(me,t).slice(0,3).forEach((s,i)=>R(s,.05,mc,0,i?.6:1.3,1.3));}}
 else if(hovW==='pvo'){for(const s of lands(me).filter(s=>s.st.pvo>0).slice(0,10))R(s,pvoRange(me),WCOL.pvo,0,.8);}
 else if(hw){const own=lands(me),has=own.filter(s=>s.st[hw]>0);for(const s of (has.length?has:own).slice(0,8))R(s,wRange(me,hw),WCOL[hw],has.length?0:70,.8);}
 return L;}
function stepVis(dt){const inc=new Map();
 for(const {a,b,line} of seaRoutes){const owns=a.owner===me||b.owner===me,active=(a.job?.k==='c'&&a.job.x===b.i)||(b.job?.k==='c'&&b.job.x===a.i);
  line.visible=!!(running&&!over&&a.alive&&b.alive&&owns&&(active||hov===a||hov===b||radT===a||radT===b));}
 for(const q of projs){if(q.dead)continue;const r=1-Math.min(q.t,1),c=inc.get(q.T);if(!c||r<c[0])inc.set(q.T,[r,q.col]);}
 /* телефон: значки на обратной стороне глобуса не рисуем — они всё равно закрыты планетой */
 const zC=camera.position.length(),limM=1/zC-.02;if(LOW)cdir.copy(camera.position).normalize();
 for(const t of T){t.vis+=((t.alive?t.hp/t.maxHp*(t.burns&&t.owner<0?.6:1):0)-t.vis)*Math.min(dt*1.5,1);
  if(LOW){const mk=t.alive&&t.pos.dot(cdir)>limM;if(t.marker.visible!==mk)t.marker.visible=mk;}
  if(isGuest()){if(t.cap)t.cap.t=Math.min(t.cap.t+dt,t.cap.dur);if(t.job)t.job.t=Math.min(t.job.t+dt,t.job.dur);}
  tc.set(pcol(t.owner));if(t.cap)tc.copy(neutralC).lerp(tmpC.set(pcol(t.cap.by)),.2+.6*t.cap.t/t.cap.dur);
  t.col.lerp(tc,Math.min(dt*2.2,1));
  const u=t.mu;u.uColor.value.set(pcol(t.owner));u.uHome.value=t.owner>=0&&t.home===t.owner?1:0;u.uCap.value=t.cap?t.cap.t/t.cap.dur:0;
  const i=inc.get(t);u.uInc.value=i?i[0]:-1;if(i)u.uIncCol.value.copy(i[1]);
  {const on=running&&t.alive&&t.owner>=0&&t.st.pvo>0;
   if(on){const r=pvoRange(t.owner);if(!t.dome)mkDome(t);if(t.domeR!==r)setDome(t,r);t.domeF=Math.max(0,(t.domeF||0)-dt*1.4);
    /* купол виден не всегда: по кнопке/клавише V, при наведении на землю или на значок щита, и когда по зоне купола летит ракета */
    let want=showPvo||hovW==='pvo'||hov===t||radT===t||t.domeF>0;if(!want)for(const x of inc.keys())if(ang(t,x)<=r){want=true;break;}
    t.domeV=(t.domeV||0)+((want?1:0)-(t.domeV||0))*Math.min(dt*7,1);
    const d=t.du;d.uCol.value.set(WCOL.pvo).lerp(tmpC.set(pcol(t.owner)),.45);d.uA.value=(team[t.owner]===team[me]?.7:.22)*Math.min(1,.4+.2*t.st.pvo)*t.domeV;d.uF.value=t.domeF;}
   else t.domeV=0;
   if(t.dome)t.dome.visible=on&&t.domeV>.01;}
  t.marker.scale.setScalar(.2*THREE.MathUtils.clamp(camera.position.length()/3,.45,1.15));
  u.uSite.value=t.site?1:0;
  u.uHi.value=running&&hovW&&WPN[hovW]&&hostile(me,t)&&inReach(me,hovW,t)?1:0;}
 GU.uSel.value=radT&&radT.alive?radT.i+1:-1;
 /* пока ядерный удар в воздухе, края экрана пульсируют красным */
 {const air=projs.some(q=>!q.dead&&q.w==='n');if(air!==nukeAir){nukeAir=air;document.body.classList.toggle('nukeair',air);}}
 showRings(ringList());pushOwn();}
let showPvo=false,nukeAir=false;
function togglePvo(){showPvo=!showPvo;$('bpvo')?.classList.toggle('on',showPvo);log(showPvo?'купола щитов: видны всегда':'купола щитов: только по делу','#38bdf8');}
/* если кадры проседают, понемногу снижаем чёткость картинки, чтобы игра не тормозила */
let curPR=PR,fpsT=0,fpsN=0,slowN=0;
function setPR(v){curPR=v;renderer.setPixelRatio(v);if(composer)composer.setPixelRatio(v);pmat.uniforms.uPx.value=innerHeight*v;}
function adapt(raw){if(document.hidden||GU.uTime.value<5)return;fpsT+=raw;fpsN++;if(fpsT<1.5)return;const fps=fpsN/fpsT;fpsT=fpsN=0;
 if(fps<42&&curPR>1){if(++slowN>=2){slowN=0;setPR(Math.max(1,curPR-.25));}}else slowN=0;}
let lastSim=performance.now();
/* хост в свёрнутой вкладке: браузер глушит кадры, а игра для друга должна идти */
setInterval(()=>{if(!running||paused||!isHost())return;const now=performance.now();if(now-lastSim<300)return;let el=Math.min((now-lastSim)/1000,1.5);lastSim=now;
 while(el>0){sim(Math.min(el,.05));el-=.05;}},200);
const clock=new THREE.Clock();
function frame(){requestAnimationFrame(frame);const raw=clock.getDelta();adapt(Math.min(raw,.25));tick(Math.min(raw,.05));}
function tick(raw){GU.uTime.value+=raw;
 {const a=GU.uTime.value*6.2831853/CFG.day;GU.uSun.value.set(Math.cos(a),.3,Math.sin(a)).normalize();sunSp.position.copy(GU.uSun.value).multiplyScalar(80);}
 camera.position.sub(shakeV);
 if(fly){fly.t+=raw/1.3;const e=fly.t>=1?1:1-Math.pow(1-fly.t,3);const d=THREE.MathUtils.lerp(fly.from.length(),fly.to.length(),e);
  camera.position.copy(fly.from).normalize().lerp(fly.to.clone().normalize(),e).normalize().multiplyScalar(d);if(fly.t>=1)fly=null;}
 else{const d=camera.position.length();camera.position.setLength(d+(zoomT-d)*Math.min(1,raw*9));}
 if(running)stepKeys(raw);
 {const kx=kbMode&&running&&!over;if(kx!==kbShown){kbShown=kx;$('kbx').style.display=kx?'block':'none';}if(kx&&!down)setHov(landAt(innerWidth/2,innerHeight/2));}
 controls.rotateSpeed=THREE.MathUtils.clamp((camera.position.length()-1)*.42,.06,.9);
 controls.update();
 shake*=Math.pow(.02,raw);shakeV.set(Math.random()-.5,Math.random()-.5,Math.random()-.5).multiplyScalar(shake);camera.position.add(shakeV);
 const dt=running&&!paused?raw:0;
 if(dt>0){if(isGuest())stepProjs(dt,false);else sim(dt);lastSim=performance.now();drawHud(dt);}
 tutTick();
 stepVis(raw);drawLabels();stepPings(raw);if(radT)placeRadial();
 if(!paused){for(let i=fx.length-1;i>=0;i--)if(!fx[i](raw))fx.splice(i,1);stepParticles(raw);}
 if(composer)composer.render();else renderer.render(scene,camera);}
stepVis(1);frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);if(composer)composer.setSize(innerWidth,innerHeight);pmat.uniforms.uPx.value=innerHeight*curPR;placeCoach();});
</script>
