<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>БИМ БИМ БАМ БАМ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Unbounded:wght@300;500;800&family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--c:#3b82f6;--fg:#f8fafc;--mut:#94a3b8;--card:rgba(11,13,20,.72);--line:rgba(148,163,184,.18);--bad:#ef4444}
*{box-sizing:border-box;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#05070d;color:var(--fg);font-family:Manrope,system-ui,sans-serif}
canvas{display:block;position:fixed;inset:0}
.mono{font-family:'JetBrains Mono',monospace}
.card{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);border-radius:16px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;pointer-events:auto}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
/* список держав */
#plist{position:absolute;left:16px;top:16px;padding:10px 12px;display:grid;gap:6px;width:214px}
.pr{display:grid;grid-template-columns:8px 1fr 46px;align-items:center;gap:8px;font-size:12px;font-weight:700}
.pr i{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.pr span{color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr span em{font-style:normal;color:var(--mut);font-weight:500;margin-left:5px;font-size:10px}
.pr .bar{height:4px;border-radius:2px;background:rgba(148,163,184,.18);overflow:hidden}
.pr .bar b{display:block;height:100%;background:currentColor;transition:width .4s}
.pr.dead{opacity:.28}.pr.dead span{text-decoration:line-through}
#top{position:absolute;left:50%;top:14px;transform:translateX(-50%);text-align:center}
#clock{font-size:12px;letter-spacing:.25em;color:var(--mut)}
#warn{margin-top:8px;padding:7px 16px;border-radius:999px;border:1px solid var(--bad);color:#fecaca;background:rgba(239,68,68,.16);font-size:12px;font-weight:700;display:none;animation:blink .7s infinite alternate;max-width:44vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes blink{to{background:rgba(239,68,68,.42)}}
#feed{position:absolute;right:16px;top:16px;width:250px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#feed div{font-size:12px;font-weight:600;padding:6px 11px;border-radius:10px;background:var(--card);border-left:2px solid var(--c);animation:fin .25s ease-out;transition:opacity .8s}
@keyframes fin{from{transform:translateX(24px);opacity:0}}
/* нижняя панель */
#dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:stretch;gap:6px;padding:8px;pointer-events:auto}
#en{pointer-events:auto;display:grid;align-content:center;justify-items:center;padding:0 14px 0 10px;min-width:92px}
#en b{font-size:24px;color:var(--mut);line-height:1}#en.hot b{color:#fde047}
#en small{font-size:10px;color:var(--mut);margin-top:4px}
.sep{width:1px;background:var(--line);margin:4px 2px}
.wb,.ub{position:relative;width:58px;height:66px;border-radius:12px;border:1px solid var(--line);background:rgba(148,163,184,.06);display:grid;justify-items:center;align-content:center;gap:2px;transition:transform .15s,background .15s,border-color .15s,opacity .15s}
.wb:hover:not(.off),.ub:hover:not(.off){background:rgba(148,163,184,.18);border-color:#fff;transform:translateY(-2px)}
.wb .lbl,.ub .lbl{font-size:9px;letter-spacing:.06em;color:var(--mut)}
.wb .cost,.ub .cost{font-size:10px;color:#fde047}
.wb .cnt{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--c);color:#000;font-size:11px;display:grid;place-items:center;padding:0 5px}
.wb .cnt.z{background:#1e293b;color:var(--mut)}
.wb.off,.ub.off{opacity:.36}.wb.run,.ub.run{border-color:#fde047}
.wb.lock svg.ic{opacity:.3}.wb.lock::after{content:"";position:absolute;inset:0;border-radius:12px;background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(148,163,184,.08) 6px 7px)}
.ub{width:50px}
.pips{display:flex;gap:2px}.pips i{width:8px;height:3px;border-radius:2px;background:rgba(148,163,184,.25)}.pips i.on{background:#fde047}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(253,224,71,.25);border-color:#fde047}}
#abil{position:absolute;right:16px;bottom:16px;padding:9px 13px;display:flex;gap:9px;align-items:center;font-size:12px;font-weight:700;pointer-events:auto;color:var(--c)}
#abil span{color:var(--fg)}
#misc{position:absolute;left:16px;bottom:16px;display:flex;gap:6px}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--mut);transition:.15s}
.ib:hover{color:#fff;border-color:#fff}
/* подсказка-обучение */
#coach{position:absolute;left:50%;bottom:108px;transform:translateX(-50%);padding:10px 12px 10px 16px;display:none;align-items:center;gap:12px;font-size:13px;font-weight:700;pointer-events:auto;border-color:rgba(253,224,71,.5);max-width:min(560px,90vw)}
#coach .n{color:#fde047;font-size:11px}
#coach button{padding:6px 12px;border-radius:9px;border:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap}
#coach button:hover{border-color:#fff}
/* круговое меню */
#radial{position:fixed;left:0;top:0;z-index:4;display:none}
#radial .rb{position:absolute;width:52px;height:52px;margin:-26px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(11,13,20,.9);display:grid;place-items:center;color:#fff;transition:transform .12s,background .12s;animation:rin .16s ease-out backwards}
#radial .rb:hover:not(.off){transform:scale(1.14);background:var(--bad);border-color:#fff}
#radial .rb.cap:hover:not(.off){background:var(--c)}
#radial .rb.off{opacity:.35;border-style:dashed}
#radial .rb b{position:absolute;bottom:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:#fff;color:#000;font-size:10px;display:grid;place-items:center}
#radial .dot{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;border:2px solid #fff}
#radial .manage{border-color:#fbbf24;color:#fbbf24}
#arsenal{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:min(340px,calc(100vw - 32px));max-height:65vh;overflow:auto;padding:16px;pointer-events:auto;display:none;z-index:6}
#arsenal header{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:800;margin-bottom:10px}
#arsenal select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:#121b2c;color:#fff;font:inherit}
#arsenal p{font-size:12px;color:var(--mut);line-height:1.5;margin:10px 0}
.arow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:12px}
#arsenal button{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:12px}
#arsenal button:hover{border-color:#fbbf24;color:#fbbf24}
#arsenal button:disabled{opacity:.35;cursor:default}
#arsenal .arcount{color:#fde047;margin-left:auto}.arfull{color:#fbbf24!important}
@keyframes rin{from{transform:scale(.4);opacity:0}}
#tip{position:fixed;z-index:8;pointer-events:none;display:none;padding:9px 12px;max-width:250px;font-size:12px;line-height:1.4;border-radius:12px}
#tip b{display:block;font-size:13px;margin-bottom:2px}#tip small{color:var(--mut);display:block;margin-top:4px}
/* подписи на глобусе */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;left:0;top:0;text-align:center;will-change:transform;display:none}
.lab .n{font-family:Unbounded;font-weight:500;font-size:9px;letter-spacing:.07em;text-shadow:0 0 6px #000,0 0 2px #000;white-space:nowrap}
.lab .hb{width:44px;height:4px;border-radius:2px;background:rgba(0,0,0,.55);margin:3px auto 0;overflow:hidden;border:1px solid rgba(255,255,255,.18)}
.lab .hb b{display:block;height:100%;background:currentColor}
.lab .sl{display:flex;gap:2px;justify-content:center;margin:3px auto 0;width:max-content;padding:1px 2px;border-radius:5px}
.lab .sl i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.lab .sl i.w{background:#fff}.lab .sl i.p{background:#38bdf8}.lab .sl i.b{background:#fde047;opacity:.7}
.lab .jb{width:30px;height:2px;margin:2px auto 0;background:rgba(255,255,255,.18);border-radius:1px;overflow:hidden}.lab .jb b{display:block;height:100%;background:#fde047}
.lab.idle .sl{outline:1px solid #fde047;animation:idl .8s infinite alternate}
@keyframes idl{to{outline-color:transparent}}
.lab.zone .n{display:none}.lab.zone.show .n{display:block}.lab.zone .hb{width:30px}
#flash{position:fixed;inset:0;background:radial-gradient(circle,#fff,#ff9a3a);opacity:0;pointer-events:none;mix-blend-mode:screen}
/* экраны */
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5vh 16px 4vh;pointer-events:none;z-index:5;background:radial-gradient(ellipse at center,transparent 38%,rgba(3,5,10,.9))}
.ov>*{pointer-events:auto}
.ov h1{font-family:Unbounded;font-size:clamp(30px,6vw,80px);margin:0;font-weight:800;letter-spacing:.32em;margin-right:-.32em;text-shadow:0 0 50px rgba(59,130,246,.9)}
#start h1{font-family:'Russo One',Impact,'Arial Black',sans-serif;font-size:clamp(48px,8.5vw,116px);font-weight:400;letter-spacing:.025em;margin-right:0;line-height:.94;text-align:center;transform:skewY(-3deg);background:linear-gradient(#fff8d4 4%,#ffcf56 40%,#ff731e 72%,#d62622 100%);background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-stroke:1px rgba(255,229,162,.35);filter:drop-shadow(0 5px 0 #651717) drop-shadow(0 0 24px #f9542660);text-shadow:none}
#roster{font-size:12px;line-height:1.6;text-align:center;color:#cbd5e1}
#pick .chip.his{opacity:.55}
.tag{font-size:11px;letter-spacing:.4em;color:var(--mut);margin-top:10px;text-align:center}
.bot{display:grid;justify-items:center;gap:12px;max-width:820px}
#pick{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700;display:flex;gap:7px;align-items:center;transition:.15s}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--pc)}
.chip:hover{border-color:var(--pc)}
.chip.sel{background:var(--pc);color:#05070d;border-color:#fff}.chip.sel i{background:#05070d}
.chip.his{outline:2px dashed #fff;outline-offset:2px}
#acard{padding:10px 16px;display:flex;gap:12px;align-items:center;font-size:13px;min-height:52px;max-width:560px}
#acard b{display:block}#acard span{color:var(--mut);font-size:12px}
#opts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
#mp{display:none;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;padding:8px 12px;font-size:12px}
#mp input[type=text]{width:86px;background:rgba(148,163,184,.1);border:1px solid var(--line);border-radius:9px;color:#fff;padding:8px 10px;font-family:'JetBrains Mono';font-size:13px;letter-spacing:.2em;text-transform:uppercase;user-select:text}
#mcode{font-size:20px;letter-spacing:.3em;color:#fde047;user-select:text}
#mstat{font-size:12px;color:#fde047;min-height:16px;text-align:center}
#go{font-family:Unbounded;font-weight:800;font-size:14px;padding:15px 48px;letter-spacing:.25em;background:#fff;color:#000;border-radius:999px;box-shadow:0 0 40px rgba(59,130,246,.8);transition:.15s}
#go:hover:not(:disabled){transform:scale(1.04)}#go:disabled{opacity:.5}
#end{display:none;justify-content:center;gap:22px;background:rgba(3,5,10,.75)}
#end p{max-width:560px;text-align:center;line-height:1.5;color:var(--mut)}
@media (max-width:1180px){#misc{bottom:104px}#abil{bottom:104px}#coach{bottom:156px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="labels"></div>
<div id="flash"></div>
<div id="hud">
  <div id="plist" class="card"></div>
  <div id="top"><div id="clock" class="mono">00:00</div><div id="warn"></div></div>
  <div id="feed"></div>
  <div id="coach" class="card"><span class="n mono"></span><span class="t"></span><button id="cnext">дальше</button><button id="cskip" aria-label="пропустить обучение">✕</button></div>
  <div id="dock" class="card"></div>
  <div id="abil" class="card"></div>
  <div id="misc"></div>
  <section id="arsenal" class="card" aria-label="управление арсеналом"></section>
</div>
<div id="radial"></div>
<div id="tip" class="card"></div>
<div id="start" class="ov">
  <div><h1 aria-label="БИМ БИМ БАМ БАМ">БИМ БИМ<br>БАМ БАМ</h1><div class="tag">12 ДЕРЖАВ · ДО 5 ИГРОКОВ · ОДНА ПЛАНЕТА</div></div>
  <div class="bot">
    <div id="pick"></div>
    <div id="acard" class="card"></div>
    <div id="opts"></div>
    <div id="mp" class="card">
      <button class="chip" id="mhost">создать комнату</button><b id="mcode" class="mono"></b>
      <input type="text" id="mjoin" placeholder="КОД" maxlength="5" aria-label="код комнаты"><button class="chip" id="mjoinb">войти</button>
      <label><input type="checkbox" id="ally" checked> союз против ботов</label>
    </div>
    <div id="mstat"></div>
    <div id="roster" aria-live="polite"></div>
    <button id="go">НАЧАТЬ</button>
  </div>
</div>
<div id="end" class="ov"><h1 id="etitle"></h1><p id="etext"></p><button id="again" class="chip" style="padding:13px 28px">ещё раз</button></div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ================= БАЛАНС (все цифры здесь) ================= */
const CFG={
 peace:60,                 // сек перемирия в начале
 escalate:1500,            // каждые столько секунд все стройки ускоряются ещё на 100%
 homeHp:60, zoneHp:20,     // прочность столицы и обычной земли
 homeSlots:6, zoneSlots:3, // ячейки под оружие и щит
 capTime:20, pvoTime:16,   // сек на захват и на заряд щита
 pvoBase:.6, pvoDrone:.6, pvoPerLvl:.09, pvoRange:.42, armPerLvl:.15, ecoPerLvl:.2,
 fallout:75, wasteHp:.7, wasteSlots:2,   // сожжённая земля через fallout сек снова ничья, но слабее; второй раз сгорает навсегда
 aiThink:[2.5,4.5], aiAttackCd:[50,90], aiGrab:.3,   // aiGrab: как жадно боты хватают ничьи земли (0..1)
 diff:[{n:'легко',tick:1.5,aggro:.6},{n:'норм',tick:1,aggro:1},{n:'жесть',tick:.6,aggro:1.7}]
};
/* оружие: time сек стройки, dmg урон, range дальность в радианах (3.2 = вся планета), spd [база, +за радиан] сек полёта, h высота дуги, lvl нужный уровень ракетной программы */
const WPN={
 d:{n:'Стая БПЛА',s:'БПЛА',time:15,dmg:1.5,range:1.1,spd:[10,20],h:.012,lvl:0,count:4,desc:'4 дрона. Летят далеко, но медленно. Хорошо выжирают чужой щит'},
 t:{n:'Тактическая ракета',s:'ТАКТ',time:20,dmg:5,range:.8,spd:[7,10],h:.07,lvl:0,desc:'Близко и быстро'},
 m:{n:'Ракета средней дальности',s:'СРЕД',time:32,dmg:8,range:1.7,spd:[9,10],h:.2,lvl:1,desc:'Достаёт соседние континенты'},
 i:{n:'МБР',s:'МБР',time:55,dmg:13,range:3.2,spd:[16,8],h:.5,lvl:2,desc:'Летит в любую точку планеты'},
 h:{n:'Гиперзвук',s:'ГИПЕР',time:65,dmg:9,range:1.9,spd:[4,5],h:.035,lvl:3,nopvo:true,desc:'Щит его не сбивает'}};
const WK=['d','t','m','i','h'],BK=[...WK,'pvo'];
const UP={
 eco:{n:'Заводы',time:[60,100,150],desc:'Всё строится на 20% быстрее за уровень'},
 rkt:{n:'Ракетная программа',time:[80,150,220],desc:'Открывает: средние → МБР → гиперзвук'},
 pvo:{n:'Радары',time:[60,100,150],desc:'+9% к шансу перехвата и шире зона щита за уровень'},
 arm:{n:'Бункеры',time:[60,100,150],desc:'−15% получаемого урона за уровень'}};
const UK=['eco','rkt','pvo','arm'];
const POWERS=[
 ['RUS','#ef4444','Ракетный щит','МБР на уровень раньше и строится на треть быстрее'],
 ['CHN','#f59e0b','Фабрика мира','всё оружие строится на 25% быстрее'],
 ['USA','#3b82f6','Авианосные группы','дальность оружия +30%, морские высадки на 20% быстрее'],
 ['KOR','#f472b6','Точная электроника','тактические ракеты и щиты строятся на 30% быстрее'],
 ['DEU','#e2e8f0','Инженерия','исследования на 30% быстрее'],
 ['GBR','#a78bfa','Морская разведка','морские высадки на 35% быстрее, шанс перехвата +8%'],
 ['FRA','#22d3ee','Ударная сила','все ракеты бьют на 2 сильнее'],
 ['BRA','#4ade80','Освоение территорий','захват по суше вдвое быстрее'],
 ['ZAF','#d9f99d','Ресурсный резерв','прочность земель +25%, на каждой земле дополнительная ячейка'],
 ['AUS','#fde047','Океанский тыл','морские высадки на 25% быстрее, земли чинятся: +1 прочность каждые 12 с'],
 ['IRN','#2dd4bf','Беспилотный рой','в стае 6 дронов, летят на 60% дальше и строятся на 25% быстрее'],
 ['ISR','#fb923c','Железный купол','4 заряда щита на старте, щиты строятся на 40% быстрее, шанс перехвата +10%']
].map(([a3,color,abil,adesc])=>({a3,color,abil,adesc,name:''}));
const NEUTRAL='#4b5b7d';
const is=(p,a3)=>p>=0&&POWERS[p].a3===a3;

/* ================= КАРТА ================= */
const ll=(lat,lon,r=1)=>{const ph=(90-lat)*Math.PI/180,th=(lon+180)*Math.PI/180;
 return new THREE.Vector3(-r*Math.sin(ph)*Math.cos(th),r*Math.cos(ph),r*Math.sin(ph)*Math.sin(th));};
const W=window.WORLD;
const T=W.units.map((u,i)=>({i,name:u.n,pos:ll(u.c[1],u.c[0]),owner:-1,home:-1,hp:CFG.zoneHp,maxHp:CFG.zoneHp,alive:true,cap:null,job:null,slots:CFG.zoneSlots,st:{d:0,t:0,m:0,i:0,h:0,pvo:0},burns:0,rev:0,vis:1,col:new THREE.Color(NEUTRAL),dirty:true,adj:u.adj}));
T.forEach(t=>{t.adj=t.adj.map(j=>T[j]);t.sea=(W.units[t.i].sea||[]).map(j=>T[j]);});
POWERS.forEach((p,k)=>{const t=T[W.units.findIndex(u=>u.key===p.a3)];p.name=t.name;p.home=t;t.owner=t.home=k;});
const TW=4096,TH=2048,X=lon=>(lon+180)/360*TW,Y=lat=>(90-lat)/180*TH;

function aiLand(p,L){const P=PW[p],foes=T.filter(t=>hostile(p,t));
 const nb=[...new Set([...L.adj,...L.sea])].filter(t=>t.alive&&t.owner===-1&&!t.cap);
 if(nb.length&&time>25&&Math.random()<CFG.aiGrab)return capture(p,pick(nb),L);
 const res=()=>{const ks=UK.filter(k=>P.up[k]<3&&!researching(p,k));return ks.length?upgrade(p,ks.includes('rkt')&&Math.random()<.55?'rkt':pick(ks),L):false;};
 const reach=WK.filter(w=>foes.some(t=>ang(L,t)<=wRange(p,w)));
 if(free(L)<=0){if(res())return true;
  /* склад забит тем, что уже ни до кого не достаёт: списываем */
  const junk=WK.find(w=>L.st[w]>0&&!reach.includes(w));if(junk)scrap(p,L,junk);return false;}
 const near=foes.some(t=>ang(L,t)<1.7);
 if(L.st.pvo<(L.home===p?2:near?1:0))return build(p,'pvo',L);
 if(!lands(p).some(t=>t.job&&t.job.k==='r')&&Math.random()<.4&&res())return true;
 const ok=reach.filter(w=>P.up.rkt>=wLvl(p,w));
 if(ok.length)return build(p,Math.random()<.6?ok[ok.length-1]:pick(ok),L);
 if(P.up.rkt<3&&!researching(p,'rkt'))return upgrade(p,'rkt',L);
 return L.st.pvo<2?build(p,'pvo',L):res();}
function aiThink(p){const P=PW[p],D=CFG.diff[diff];if(!P.alive)return;
 for(const L of lands(p).filter(t=>!t.job).sort(()=>Math.random()-.5).slice(0,2))aiLand(p,L);
 if(time<CFG.peace||time<P.atk)return;
 const foes=T.filter(t=>hostile(p,t)),opts=[];
 for(const t of foes){const sh=T.reduce((a,s)=>a+(s.alive&&s.owner===t.owner&&ang(s,t)<=pvoRange(t.owner)?s.st.pvo:0),0);
  for(const w of WK)if(srcFor(p,w,t))opts.push([w,t,(humans.has(t.owner)?D.aggro:1)*(1.6-t.hp/t.maxHp)*(WPN[w].dmg+2)/(1+.35*sh*(WPN[w].nopvo?0:1))]);}
 if(!opts.length)return;
 let s=opts.reduce((a,o)=>a+o[2],0)*Math.random(),ch=opts[0];for(const o of opts){s-=o[2];if(s<=0){ch=o;break;}}
 fire(p,ch[0],ch[1]);
 /* чем дольше идёт партия, тем больше залп и короче пауза между атаками */
 const extra=Math.min(3,Math.floor(time/480));for(let k=1;k<=extra;k++)later(k*1.5,()=>{const w2=[...WK].reverse().find(w=>srcFor(p,w,ch[1]));if(w2)fire(p,w2,ch[1]);});
 P.atk=time+rnd(CFG.aiAttackCd)*D.tick/(1+time/900);}

 const mine=lands(me),t=T[arsenalLand];if(!running||over||!t||!t.alive||t.owner!==me){closeArsenal();return;}
 const key=[t.i,...BK.map(w=>t.st[w]),t.job?.k,t.job?.w,t.job?.x,Math.ceil((t.job?.dur||0)-(t.job?.t||0)),...Object.values(PW[me].up),paused,...mine.map(s=>s.i)].join('|');
 if(key===arsenalKey||document.activeElement?.id==='arsenal-select')return;arsenalKey=key;
 panel.innerHTML=`<header>арсенал <button data-ar="close" aria-label="закрыть арсенал">✕</button></header><select id="arsenal-select" aria-label="твоя территория">${mine.map(s=>`<option value="${s.i}"${s===t?' selected':''}>${s.name} · ${free(s)} своб.</option>`).join('')}</select>
 <p class="${free(t)<=0?'arfull':''}">ячейки: ${used(t)} / ${t.slots}${t.job?.k==='b'?' · 1 строится':''} · свободно ${free(t)}</p>
 ${t.job?`<div class="arow"><span>${jobTxt(t)}</span><button data-ar="cancel">отменить</button></div>`:'<p>территория свободна для нового дела</p>'}
 ${BK.map(w=>`<div class="arow"><span>${w==='pvo'?'щит':WPN[w].s}</span><b class="arcount">${t.st[w]}</b><button data-ar="buy" data-weapon="${w}" ${t.job||free(t)<=0||PW[me].up.rkt<wLvl(me,w)?'disabled':''} aria-label="строить ${w==='pvo'?'щит':WPN[w].n}">+ ${Math.round(wTime(me,w))}с</button><button data-ar="scrap" data-weapon="${w}" ${t.st[w]<=0?'disabled':''} aria-label="списать ${w==='pvo'?'щит':WPN[w].n}">−1</button></div>`).join('')}
 <p>списание сразу освобождает ячейки. отмена останавливает производство, исследование или высадку; прогресс теряется.</p><button data-ar="clear" ${used(t)<=0?'disabled':''}>очистить склад этой земли</button>`;
}
$('arsenal').addEventListener('change',e=>{if(e.target.id==='arsenal-select'){arsenalLand=Number(e.target.value);arsenalKey='';e.target.blur();refreshArsenal();}});
$('arsenal').addEventListener('click',async e=>{const b=e.target.closest('[data-ar]');if(!b||b.disabled)return;const c=b.dataset.ar;if(c==='close')return closeArsenal();
 const t=T[arsenalLand];b.disabled=true;const ok=await order(c,b.dataset.weapon,c==='buy'?null:t,c==='buy'?t:null);if(ok){S.click();if(c==='buy')tutEvent(b.dataset.weapon==='pvo'?'pvo':'buy');}else S.no();arsenalKey='';refreshArsenal();});

/* --- круговое меню: кликнул по земле, выбрал чем --- */
let radT=null;
function closeRadial(){$('radial').style.display='none';radT=null;}
const jobTxt=t=>{const j=t.job;return(j.k==='b'?'строит: '+(j.w==='pvo'?'щит':WPN[j.w].n):j.k==='r'?'исследует: '+UP[j.w].n:'захватывает: '+T[j.x].name)+`, ещё ${Math.ceil(j.dur-j.t)} с`;};
function openRadial(t,x,y){const R=$('radial'),P=PW[me];let items=[];
 if(hostile(me,t)){if(time<CFG.peace){log('перемирие: стрелять пока нельзя','#fde047');S.no();return;}
  items=WK.filter(w=>total(me,w)>0).map(w=>{const n=lands(me).filter(s=>ang(s,t)<=wRange(me,w)).reduce((a,s)=>a+s.st[w],0);
   return{c:'fire',w,off:!n,n:n||total(me,w),tip:`${WPN[w].n}: ${n?'урон '+wDmg(me,w)+(w==='d'?' × '+wCount(me,w):''):'отсюда не достаёт'}`};});
  if(!items.length){log('нечем стрелять: построй оружие','#fde047');S.no();pulse('.wb[data-buy="t"]');return;}
  const all=items.reduce((a,i)=>a+(i.off?0:i.n),0);if(all>1)items.push({c:'fire',w:'*',n:Math.min(all,8),tip:'залп: всё, что достаёт'});}
 else if(t.owner===me)return openArsenal(t);
 else if(t.owner===-1&&t.alive){const sources=capSources(me,t),s=sources[0],sea=s&&!t.adj.includes(s);
  if(t.cap){log(t.cap.by===me?'уже захватываешь':'эту землю уже забирают','#fde047');return;}
  items=[{c:'cap',off:!canCap(me,t),n:s?Math.ceil(capDuration(me,s,t)):'—',tip:!s?'нужна свободная своя земля у сухопутной или морской границы':`${sea?'морская высадка':'захват'}: ${t.name} · из ${s.name} · ${Math.ceil(capDuration(me,s,t))} с`}];}
 else return closeRadial();
 radT=t;R.style.display='block';R.style.transform=`translate(${x}px,${y}px)`;
 const n=items.length,sp=n>1?Math.min(40,170/(n-1)):0;
 R.innerHTML='<i class="dot"></i>'+items.map((it,k)=>{const a=(-90+(k-(n-1)/2)*sp)*Math.PI/180,rx=Math.cos(a)*84,ry=Math.sin(a)*84;
  return`<button class="rb${it.c==='fire'?'':' cap'}${it.off?' off':''}" style="left:${rx}px;top:${ry}px;animation-delay:${k*30}ms" data-c="${it.c}" data-w="${it.w||''}" data-t="${it.tip}" aria-label="${it.tip}">${IC[it.c==='cap'?'cap':it.w==='*'?'all':it.w]}<b class="mono">${it.n}</b></button>`;}).join('');}
$('radial').addEventListener('click',async e=>{const b=e.target.closest('.rb');if(!b||!radT)return;if(b.classList.contains('off')){S.no();return;}
 const t=radT,c=b.dataset.c,w=b.dataset.w;closeRadial();$('tip').style.display='none';
 if(await order(c,w,c==='buy'?null:t,c==='buy'?t:null)){c==='fire'?S.click():S.buy();tutEvent(c==='buy'?(w==='pvo'?'pvo':'buy'):c);}else S.no();});
const pulse=sel=>{const el=document.querySelector(sel);if(!el)return;el.classList.add('pulse');setTimeout(()=>el.classList.remove('pulse'),2400);};

/* --- обучение: короткие шаги, можно пропустить --- */
const TUT=[
 {t:'Это твоя держава. Точки под землёй: ячейки под оружие и щит.',next:true},
 {t:'Нажми на ракету внизу: свободная земля начнёт её строить.',on:'buy',hl:'.wb[data-buy="t"]'},
 {t:'Кликни по серой земле у сухопутной или морской границы. Голубой пунктир — маршрут высадки.',on:'cap'},
 {t:'Кликни по своей земле и поставь в неё щит. Он сам сбивает то, что летит рядом.',on:'pvo'},
 {t:'Когда кончится перемирие: клик по врагу, потом выбери оружие.',on:'fire'},
 {t:'Справа исследования. Они открывают дальние ракеты.',on:'up',hl:'.ub[data-up="rkt"]'},
 {t:'Склад забит? Кликни по своей земле или нажми «арсенал»: списывай оружие кнопкой −1, отменяй дела.',next:true}];
const tut={step:0,on:false};
function showCoach(){const c=$('coach');document.querySelectorAll('.pulse').forEach(x=>x.classList.remove('pulse'));
 if(!tut.on||tut.step>=TUT.length){c.style.display='none';tut.on=false;try{localStorage.setItem('zarevo_tut','1');}catch(e){}return;}
 const s=TUT[tut.step];c.style.display='flex';c.querySelector('.n').textContent=`${tut.step+1}/${TUT.length}`;c.querySelector('.t').textContent=s.t;
 $('cnext').style.display=s.next?'':'none';if(s.hl){const el=document.querySelector(s.hl);if(el)el.classList.add('pulse');}}
function tutEvent(name){if(tut.on&&TUT[tut.step]&&TUT[tut.step].on===name){tut.step++;showCoach();}}
$('cnext').onclick=()=>{tut.step++;showCoach();};$('cskip').onclick=()=>{tut.on=false;showCoach();};

addEventListener('keydown',async e=>{if(!running||['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;const k=e.code,n='123456'.indexOf(e.key);
 if(n>=0&&n<5&&hov&&hostile(me,hov)){if(await order('fire',WK[n],hov)){S.click();tutEvent('fire');}else S.no();}
 else if(n>=0&&hov&&hov.owner===me){if(await order('buy',BK[n],null,hov)){S.buy();tutEvent(n===5?'pvo':'buy');}else S.no();}
 else if(k==='Escape'){closeRadial();closeArsenal();}else if(k==='Space'){e.preventDefault();$('bpause').onclick();}});
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function landAt(x,y){mouse.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(mouse,camera);const h=ray.intersectObject(globe)[0];if(!h)return null;
 const s=slotAt(h.uv.x,h.uv.y);return s>0&&s<255?T[s-1]:null;}
let down=null;const cv=renderer.domElement;
cv.addEventListener('wheel',e=>{e.preventDefault();closeRadial();const k=e.deltaMode===1?.06:e.ctrlKey?.012:.0016;zoomT=THREE.MathUtils.clamp(zoomT*Math.exp(e.deltaY*k),1.3,5.5);fly=null;},{passive:false});
cv.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];controls.autoRotate=false;closeRadial();});
cv.addEventListener('pointerup',e=>{if(!down)return;const moved=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(moved>6||e.button!==0)return;
 const t=landAt(e.clientX,e.clientY);
 if(!running){if(!over&&t&&t.home>=0)$('pick').children[t.home].click();return;}
 if(over||!t||!t.alive||!PW[me].alive)return;S.click();openRadial(t,e.clientX,e.clientY);});
cv.addEventListener('pointermove',e=>{if(down)return;const t=landAt(e.clientX,e.clientY);if(t===hov)return;hov=t;GU.uHov.value=t&&t.alive?t.i+1:-1;
 document.body.style.cursor=t&&t.alive&&(running||t.home>=0)?'pointer':'';});

const pv3=new THREE.Vector3(),cdir=new THREE.Vector3();
function drawLabels(){camera.updateMatrixWorld();cdir.copy(camera.position).normalize();const lim=1/camera.position.length()+.1;
 for(const t of T){const L=t.lab,own=t.owner>=0,show=t.alive&&t.pos.dot(cdir)>lim&&(own||t===hov||t.cap);
  if(!show){if(L.style.display!=='none')L.style.display='none';continue;}
  const mine=running&&own&&team[t.owner]===team[me];
  if(t.dirty){t.dirty=false;L.className='lab'+(t.home>=0&&t.owner===t.home?'':' zone');L.style.color=own?pcol(t.owner):'#cbd5e1';L.firstChild.textContent=t.name;
   L.children[1].style.display=own?'':'none';L.children[1].firstChild.style.width=Math.max(0,t.hp/t.maxHp*100)+'%';
   const sl=L.children[2];sl.style.display=mine?'':'none';
   if(mine){let h='';for(const w of BK)h+=(w==='pvo'?'<i class="p"></i>':'<i class="w"></i>').repeat(t.st[w]);if(t.job&&t.job.k==='b')h+='<i class="b"></i>';sl.innerHTML=h+'<i></i>'.repeat(Math.max(0,free(t)));}}
  const jb=L.children[3],j=mine&&t.job;jb.style.display=j?'':'none';if(j)jb.firstChild.style.width=(j.t/j.dur*100).toFixed(0)+'%';
  L.classList.toggle('idle',running&&!over&&t.owner===me&&!t.job);
  L.classList.toggle('show',t===hov);
  pv3.copy(t.pos).multiplyScalar(1.014).project(camera);L.style.display='block';
  L.style.transform=`translate(-50%,12px) translate(${((pv3.x+1)/2*innerWidth).toFixed(1)}px,${((1-pv3.y)/2*innerHeight).toFixed(1)}px)`;}}
const hp0=p=>Math.round(CFG.homeHp*hpMul(p));
let hudT=0,warned=false;
function drawHud(dt){hudT-=dt;if(hudT>0)return;hudT=.3;refreshDock();
 const rows=POWERS.map((p,i)=>({p,i,hp:lands(i).reduce((s,t)=>s+t.hp,0)})).sort((a,b)=>(b.i===me)-(a.i===me)||(b.i===him)-(a.i===him)||b.hp-a.hp);
  $('plist').innerHTML=rows.map(({p,i,hp})=>`<div class="pr${hp>0?'':' dead'}" style="color:${p.color}"><i></i><span>${p.name}${i===me?'<em>ты</em>':humans.has(i)?`<em>${allied?'союзник':'игрок'}</em>`:''}</span><div class="bar"><b style="width:${Math.min(100,hp/(hp0(i)*1.6)*100)}%"></b></div></div>`).join('');
 const left=Math.ceil(CFG.peace-time),m=Math.floor(time/60),s=Math.floor(time%60);$('clock').textContent=left>0?`ПЕРЕМИРИЕ ${left}`:String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
 const inc=projs.filter(q=>q.T.owner===me&&q.T.alive&&team[q.owner]!==team[me]);
 const names=[...new Set(inc.map(q=>`${WPN[q.w].s} → ${q.T.name}`))];
 $('warn').style.display=names.length?'block':'none';$('warn').textContent=names.slice(0,3).join('  ·  ');
 if(names.length&&!warned)S.alarm();warned=!!names.length;
}
function finish(win){over=true;closeRadial();const mm=Math.floor(time/60);setTimeout(()=>{controls.autoRotate=true;$('hud').style.display='none';
  $('etitle').textContent=win?'ПОБЕДА':'ПЕПЕЛ';
  $('etext').textContent=win?(allied?`Вы с союзником пережили всех за ${mm} мин.`:`${POWERS[me].name} осталась одна на планете. На это ушло ${mm} мин.`):`${POWERS[me].name} сгорела на ${mm}-й минуте.`;
  $('end').style.display='flex';},2500);}
/* Личное поражение хоста не останавливает матч живого гостя. */
function checkEnd(){if(time<=1)return;const aliveTeams=new Set(T.filter(t=>t.alive&&t.owner>=0).map(t=>team[t.owner]));
 if(!over){if(!aliveTeams.has(team[me]))finish(false);else if(aliveTeams.size===1)finish(true);}
 if(!isGuest()&&(aliveTeams.size<=1||(humans.size&&![...humans].some(p=>PW[p].alive)))){matchEnded=true;running=false;}}
$('again').onclick=()=>location.reload();

/* --- стартовый экран --- */
POWERS.forEach((p,i)=>{const b=document.createElement('button');b.className='chip';b.innerHTML=`<i></i>${p.name}`;b.style.setProperty('--pc',p.color);
 b.onclick=()=>{if(running)return;if(net&&i!==me&&(roomPlayers().includes(i)||(isHost()&&[...net.guests.keys()].some(c=>c.player===i)))&&!(isGuest()&&net.assigned===i))return mstat('эта страна уже занята игроком');
  me=i;[...$('pick').children].forEach((x,j)=>x.classList.toggle('sel',j===i));GU.uHov.value=p.home.i+1;flyTo(p.home.pos,3.1);
  $('acard').innerHTML=`<span style="color:${p.color}">${IC.star}</span><div><b>${p.abil}</b><span>${p.adesc}</span></div>`;
  if(isHost())lobbyUpdate();else if(isGuest())net.conn.send({t:'pick',p:me});};$('pick').appendChild(b);});
$('opts').innerHTML=CFG.diff.map((d,i)=>`<button class="chip dch${i===1?' sel':''}" style="--pc:#fff" data-d="${i}">${d.n}</button>`).join('')+'<span class="sep" style="height:24px"></span><button class="chip" id="mpb" style="--pc:#fde047">с друзьями · до 5</button>';
$('opts').addEventListener('click',e=>{const b=e.target.closest('.dch');if(b){diff=+b.dataset.d;document.querySelectorAll('.dch').forEach(x=>x.classList.toggle('sel',x===b));}
 if(e.target.closest('#mpb'))$('mp').style.display=$('mp').style.display==='flex'?'none':'flex';});
let fly=null;
function flyTo(pos,dist){fly={from:camera.position.clone(),to:pos.clone().normalize().multiplyScalar(dist),t:0};zoomT=dist;controls.autoRotate=false;}
function startGame(c){au().resume();me=c.me;him=c.him;diff=c.diff;humans=new Set(c.players||[me,...(him>=0?[him]:[])]);allied=c.ally&&humans.size>1;
 team=POWERS.map((_,i)=>allied&&humans.has(i)?99:i);
 POWERS.forEach((_,p)=>{const P=PW[p],h=POWERS[p].home;h.maxHp=h.hp=hp0(p);h.slots=CFG.homeSlots+slotBonus(p);h.st.t=1;h.st.pvo=is(p,'ISR')?4:2;});T.forEach(t=>t.dirty=true);
 running=true;$('start').style.display='none';$('hud').style.display='block';GU.uHov.value=-1;buildDock();
 document.documentElement.style.setProperty('--c',POWERS[me].color);$('abil').innerHTML=`${IC.star}<span>${POWERS[me].abil}</span>`;$('abil').dataset.t=POWERS[me].adesc;
 flyTo(POWERS[me].home.pos,2.5);refreshDock();
 let seen=false;try{seen=localStorage.getItem('zarevo_tut');}catch(e){}tut.on=!seen;tut.step=0;showCoach();}
function startMatch(){if(isGuest()||running)return;const ally=$('ally').checked;
 const players=isHost()?roomPlayers():[me];
 if(isHost()){if(players.length<2)return mstat('пока никто не подключился');for(const c of net.guests.keys())if(c.open)c.send({t:'start',hp:me,gp:c.player,diff,ally,players});}
 else if(netPeer){dropPeer();resetLobby();}
 startGame({me,him:isHost()?him:-1,diff,ally,players});}
$('go').onclick=startMatch;
$('pick').children[0].click();

/* ================= ЦИКЛ ================= */
function sim(dt){if(!running||paused||matchEnded)return;time+=dt;
 for(let i=sched.length-1;i>=0;i--)if(sched[i].t<=time){const f=sched[i].fn;sched.splice(i,1);f();}
 stepWorld(dt);stepProjs(dt,true);
 POWERS.forEach((_,p)=>{if(humans.has(p))return;const P=PW[p];P.think-=dt;if(P.think<=0){P.think=rnd(CFG.aiThink)*CFG.diff[diff].tick;aiThink(p);}});
 checkEnd();netSend(dt,matchEnded);}
const neutralC=new THREE.Color(NEUTRAL);
function stepVis(dt){const inc=new Map();
 for(const {a,b,line} of seaRoutes){const owns=a.owner===me||b.owner===me,active=(a.job?.k==='c'&&a.job.x===b.i)||(b.job?.k==='c'&&b.job.x===a.i);
  line.visible=!!(running&&!over&&a.alive&&b.alive&&owns&&(active||hov===a||hov===b||radT===a||radT===b));}
 for(const q of projs){if(q.dead)continue;const r=1-Math.min(q.t,1),c=inc.get(q.T);if(!c||r<c[0])inc.set(q.T,[r,q.col]);}
 for(const t of T){t.vis+=((t.alive?t.hp/t.maxHp*(t.burns&&t.owner<0?.6:1):0)-t.vis)*Math.min(dt*1.5,1);
  if(isGuest()){if(t.cap)t.cap.t=Math.min(t.cap.t+dt,t.cap.dur);if(t.job)t.job.t=Math.min(t.job.t+dt,t.job.dur);}
  tc.set(pcol(t.owner));if(t.cap)tc.copy(neutralC).lerp(tmpC.set(pcol(t.cap.by)),.2+.6*t.cap.t/t.cap.dur);
  t.col.lerp(tc,Math.min(dt*2.2,1));
  const u=t.mu;u.uColor.value.set(pcol(t.owner));u.uHome.value=t.owner>=0&&t.home===t.owner?1:0;u.uCap.value=t.cap?t.cap.t/t.cap.dur:0;
  const i=inc.get(t);u.uInc.value=i?i[0]:-1;if(i)u.uIncCol.value.copy(i[1]);
  u.uHi.value=running&&hovW&&WPN[hovW]&&hostile(me,t)&&inReach(me,hovW,t)?1:0;}
 pushOwn();}
let lastSim=performance.now();
/* хост в свёрнутой вкладке: браузер глушит кадры, а игра для друга должна идти */
setInterval(()=>{if(!running||paused||!isHost())return;const now=performance.now();if(now-lastSim<300)return;let el=Math.min((now-lastSim)/1000,1.5);lastSim=now;
 while(el>0){sim(Math.min(el,.05));el-=.05;}},200);
const clock=new THREE.Clock();
function frame(){requestAnimationFrame(frame);tick(Math.min(clock.getDelta(),.05));}
function tick(raw){GU.uTime.value+=raw;
 camera.position.sub(shakeV);
 if(fly){fly.t+=raw/1.3;const e=fly.t>=1?1:1-Math.pow(1-fly.t,3);const d=THREE.MathUtils.lerp(fly.from.length(),fly.to.length(),e);
  camera.position.copy(fly.from).normalize().lerp(fly.to.clone().normalize(),e).normalize().multiplyScalar(d);if(fly.t>=1)fly=null;}
 else{const d=camera.position.length();camera.position.setLength(d+(zoomT-d)*Math.min(1,raw*9));}
 controls.rotateSpeed=THREE.MathUtils.clamp((camera.position.length()-1)*.42,.06,.9);
 controls.update();
 shake*=Math.pow(.02,raw);shakeV.set(Math.random()-.5,Math.random()-.5,Math.random()-.5).multiplyScalar(shake);camera.position.add(shakeV);
 dust.rotation.y+=raw*.01;
 const dt=running&&!paused?raw:0;
 if(dt>0){if(isGuest())stepProjs(dt,false);else sim(dt);lastSim=performance.now();drawHud(dt);}
 stepVis(raw);drawLabels();
 if(!paused){for(let i=fx.length-1;i>=0;i--)if(!fx[i](raw))fx.splice(i,1);stepParticles(raw);}
 composer.render();}
stepVis(1);frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);pmat.uniforms.uPx.value=innerHeight*PR;});
window.__g={CFG,UP,tick,sim,order,build,fire,capture,upgrade,scrap,clearStock,cancelJob,capSources,capDuration,openArsenal,seaRoutes,aiThink,free,total,doCmd,camera,T,PW,projs,POWERS,WPN,get humans(){return humans},spawn,nuke,get time(){return time},get net(){return net},get me(){return me},get him(){return him},get running(){return running},get over(){return over},get team(){return team}};
</script>
